# Cloudflare Pages Configuration
name = "cognigy-socketio-client"
compatibility_date = "2024-01-01"
type = "webpack"
account_id = ""  # Your Cloudflare account ID
workers_dev = true

[site]
bucket = "./public"
entry-point = "workers-site"

[env.production]
workers_dev = false

[build]
command = "npm run build"

[build.upload]
format = "directory"

[pages]
pages_build_output_dir = "dist"
